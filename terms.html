<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms and Conditions - Bentopdf</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
    <!-- Critical CSS for simpleMode - must be inline to prevent flash of unstyled content -->
    <style>
      html.simple-mode nav,
      html.simple-mode footer,
      html.simple-mode #hero-section,
      html.simple-mode #tools-header,
      html.simple-mode #features-section,
      html.simple-mode #security-compliance-section,
      html.simple-mode #faq-accordion,
      html.simple-mode #testimonials-section,
      html.simple-mode #support-section,
      html.simple-mode #donation-ribbon,
      html.simple-mode .section-divider {
        display: none !important;
      }
      html.simple-mode #app {
        padding-top: 1rem;
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link href="/src/css/styles.css" rel="stylesheet" />
    <script src="/config.js"></script>
    <!-- Immediately apply simpleMode class to prevent flash of unstyled content -->
    <script>
      if (window.PDFTOOLS_CONFIG && window.PDFTOOLS_CONFIG.simpleMode) {
        document.documentElement.classList.add('simple-mode');
      }
    </script>
  </head>

  <body class="antialiased bg-gray-900 text-gray-300">
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-30">
      <div class="container mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <div
            class="flex-shrink-0 flex items-center cursor-pointer"
            id="home-logo"
          >
            <img
              src="/images/favicon.svg"
              alt="Bento PDF Logo"
              class="h-8 w-8"
            />
            <span class="text-white font-bold text-xl ml-2">
              <a href="index.html">BentoPDF</a>
            </span>
          </div>

          <!-- Desktop Navigation -->
          <div class="hidden md:flex items-center space-x-8">
            <a href="index.html" class="nav-link">Home</a>
            <a href="/about.html" class="nav-link">About</a>
            <a href="/contact.html" class="nav-link">Contact</a>
            <a href="/licensing.html" class="nav-link">Licensing</a>
            <a href="index.html#tools-header" class="nav-link">All Tools</a>
          </div>

          <!-- Mobile Hamburger Button -->
          <div class="md:hidden flex items-center">
            <button
              id="mobile-menu-button"
              type="button"
              class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 transition-colors"
              aria-controls="mobile-menu"
              aria-expanded="false"
            >
              <span class="sr-only">Open main menu</span>
              <!-- Hamburger Icon -->
              <svg
                id="menu-icon"
                class="block h-6 w-6"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
              <!-- Close Icon -->
              <svg
                id="close-icon"
                class="hidden h-6 w-6"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    {{> footer }}
    <script type="module" src="src/js/utils/lucide-init.ts"></script>
    <script type="module" src="src/js/mobileMenu.ts"></script>
    <script type="module" src="src/js/main.ts"></script>
    <!-- JSON-LD Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TermsPage",
        "name": "Terms and Conditions - Service Agreement | BentoPDF",
        "url": "https://www.bentopdf.com/terms"
      }
    </script>
  </body>
</html>
