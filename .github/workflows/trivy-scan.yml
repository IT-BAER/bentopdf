name: Trivy Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-scan:
    runs-on: ubuntu-latest
    if: github.repository == 'IT-BAER/bentopdf'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run quick Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config
          ignore-unfixed: true
          format: sarif
          output: trivy-quick.sarif
          severity: CRITICAL,HIGH
          # Without this, format:sarif expands the scan to ALL severities, so
          # exit-code:1 fires on any LOW/MEDIUM finding instead of only the
          # CRITICAL/HIGH gate. Keep the SARIF + gate limited to severity above.
          limit-severities-for-sarif: 'true'
          exit-code: '1'
          skip-dirs: dist,node_modules,.git,_upstream

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-quick.sarif
          category: trivy-quick
